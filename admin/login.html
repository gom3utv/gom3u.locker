<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | GoM3U TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <h1 class="brand-title">GoM3U<span class="brand-accent">TV</span></h1>
            <p class="login-subtitle">Admin Control Panel</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="authAlert" class="alert alert-danger" style="display: none;" role="alert"></div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="email">Admin Email</label>
                <input type="email" id="email" class="form-control" placeholder="admin@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary btn-block">
                <span class="btn-text">LOGIN</span>
                <div id="loginSpinner" class="btn-spinner" style="display: none;"></div>
            </button>
        </form>

        <div class="login-footer">
            <a href="../index.html" class="back-link">← Back to Website</a>
        </div>
    </div>

    <!-- Auth Controller Logic -->
    <script type="module" src="../js/auth.js"></script>
</body>
</html>
