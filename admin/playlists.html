<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlists Management - GoM3U TV</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">GoM3U<span class="brand-accent">TV</span> Admin</a>
            <nav class="nav-links">
                <a href="index.html">Dashboard</a>
                <a href="playlists.html" class="active">Playlists</a>
                <a href="settings.html">Settings</a>
                <a href="statistics.html">Statistics</a>
                <button id="logoutBtn" class="btn btn-sm" style="background:#ef4444; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">Logout</button>
            </nav>
        </div>
    </header>

    <main class="container" style="padding: 2rem 1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px;">
            <div>
                <h2>Playlists Management</h2>
                <p style="color: #64748b; margin-top: 4px;">Add, edit, enable or disable your IPTV M3U playlists.</p>
            </div>
        </div>

        <div id="adminAlert" class="alert" style="display: none; margin-bottom: 1rem; padding: 10px; border-radius: 6px;"></div>

        <div class="table-responsive">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Thumbnail</th>
                        <th>Title</th>
                        <th>Status</th>
                        <th>Created Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="playlistsTableBody">
                    <!-- Dynamic Rows Loaded Here -->
                </tbody>
            </table>
        </div>

        <div id="dashLoader" class="loading-spinner" style="text-align: center; padding: 2rem;">
            <p>Loading playlists...</p>
        </div>
    </main>

    <!-- Controllers -->
    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/playlists.js"></script>
</body>
</html>
