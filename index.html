<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - GoM3U TV</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .admin-box { max-width: 450px; margin: 3rem auto; padding: 2rem; background: #fff; border-radius: 8px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .btn-full { width: 100%; }
        .dashboard-container { max-width: 800px; margin: 2rem auto; }
        .playlist-item { background: #fff; padding: 1rem; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="brand-logo">GoM3U<span class="brand-accent">TV</span> Admin</a>
            <button id="logoutBtn" class="btn btn-sm" style="display:none; background:#ef4444; color:#fff;">Logout</button>
        </div>
    </header>

    <main class="container">
        <!-- LOGIN SECTION -->
        <div id="loginSection" class="admin-box">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">Admin Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="adminEmail" required placeholder="admin@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="adminPassword" required placeholder="******">
                </div>
                <button type="submit" id="loginBtn" class="btn btn-primary btn-full">Login</button>
            </form>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboardSection" class="dashboard-container" style="display: none;">
            <div class="admin-box" style="max-width: 100%; margin: 1rem 0;">
                <h3>Add New Playlist</h3>
                <form id="playlistForm" style="margin-top: 1rem;">
                    <div class="form-group">
                        <label>Playlist Title</label>
                        <input type="text" id="title" required placeholder="e.g. Bangladesh Sports IPTV">
                    </div>
                    <div class="form-group">
                        <label>M3U Link / URL</label>
                        <input type="url" id="m3uUrl" required placeholder="https://example.com/playlist.m3u">
                    </div>
                    <div class="form-group">
                        <label>Thumbnail Image URL (Optional)</label>
                        <input type="url" id="thumbnail" placeholder="https://example.com/logo.png">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="description" rows="2" placeholder="Short description..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Playlist</button>
                </form>
            </div>

            <h3 style="margin: 2rem 0 1rem 0;">Existing Playlists</h3>
            <div id="adminPlaylistsList">Loading...</div>
        </div>
    </main>

    <script type="module" src="./js/app.js"></script>

</body>
</html>
