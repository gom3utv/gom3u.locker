<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoM3U TV - Free Verified IPTV Playlists</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS Link -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- Header Navigation Bar -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">GoM3U<span class="brand-accent">TV</span></a>
            
            <div class="nav-links">
                <a href="index.html" class="nav-link active">Home</a>

                    Telegram Channel

            </div>
        </div>

    <!-- Main Container -->
    <main class="main-content container">
        
        <!-- Dynamic Announcement Banner -->
        <div id="noticeBannerContainer"></div>

        <!-- Section Header -->
        <div class="section-header">
            <h1 class="section-title">Active Playlists</h1>

        <!-- Playlists Dynamic Grid Container -->
        <div id="playlistsGrid" class="playlists-grid">
            <!-- Loading Spinner -->
            <div id="homeLoader" class="loading-state">
                <div class="spinner"></div>
                <p>Fetching active playlists...</p>

    </main>

    <!-- Footer Section -->
    <footer class="footer">
        <div class="container">

        </div>
